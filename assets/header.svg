<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Madhav Ramdin</title>
  <desc id="desc">Computer Science student in Montreal focused on networking, systems and backend development.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>

    <!-- Typing reveal masks: one per phrase, 12s cycle -->
    <clipPath id="t1"><rect x="100" y="200" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.1;0.25;0.3;1" values="0;346;346;0;0"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="100" y="200" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.333;0.433;0.583;0.633;1" values="0;0;288;288;0;0"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="100" y="200" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.667;0.767;0.917;0.967;1" values="0;0;245;245;0;0"/>
    </rect></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
    .fade { animation: fadeUp 0.9s ease-out both; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .link { fill: none; stroke: #30363d; stroke-width: 2; }
    .node { fill: #0d1117; stroke: #58a6ff; stroke-width: 2.5; }
    .hub  { fill: #0d1117; stroke: #a371f7; stroke-width: 3; }
    .lbl  { fill: #6e7681; font-size: 11px; }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- ================= Left: intro ================= -->
    <text class="sans fade d1" x="70" y="108" fill="#8b949e" font-size="22">Hi there, I'm</text>
    <text class="sans fade d2" x="68" y="172" fill="url(#name)" font-size="62" font-weight="800" letter-spacing="-1">Madhav Ramdin</text>

    <g class="fade d3">
      <text class="mono" x="70" y="232" fill="#3fb950" font-size="24">$</text>
      <text class="mono" x="100" y="232" fill="#c9d1d9" font-size="24" textLength="346" lengthAdjust="spacingAndGlyphs" clip-path="url(#t1)">Computer Science Student</text>
      <text class="mono" x="100" y="232" fill="#c9d1d9" font-size="24" textLength="288" lengthAdjust="spacingAndGlyphs" clip-path="url(#t2)">Networking &amp; Systems</text>
      <text class="mono" x="100" y="232" fill="#c9d1d9" font-size="24" textLength="245" lengthAdjust="spacingAndGlyphs" clip-path="url(#t3)">Backend Developer</text>
      <rect x="100" y="212" width="12" height="26" fill="#58a6ff">
        <animate attributeName="x" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.1;0.25;0.3;0.333;0.433;0.583;0.633;0.667;0.767;0.917;0.967;1"
          values="104;450;450;104;104;392;392;104;104;349;349;104;104"/>
        <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
          calcMode="discrete" keyTimes="0;0.5" values="1;0"/>
      </rect>
    </g>

    <text class="sans fade d4" x="70" y="278" fill="#8b949e" font-size="16">Montréal, QC  ·  Cégep Marie-Victorin  ·  Open to Summer 2027 internships</text>

    <!-- ================= Right: animated network topology ================= -->
    <g>
      <!-- links -->
      <path class="link" d="M820 90L930 160M1000 70L930 160M1120 160L930 160M980 250L930 160M820 230L930 160"/>
      <path class="link" stroke-dasharray="4 6" d="M820 90L1000 70L1120 160L980 250L820 230Z"/>

      <!-- traffic -->
      <g filter="url(#soft)">
        <circle r="4.5" fill="#58a6ff">
          <animateMotion dur="3s" repeatCount="indefinite" path="M820 90L930 160L980 250"/>
        </circle>
        <circle r="4.5" fill="#a371f7">
          <animateMotion dur="3.4s" begin="0.8s" repeatCount="indefinite" path="M1120 160L930 160L820 230"/>
        </circle>
        <circle r="4.5" fill="#3fb950">
          <animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M820 230L930 160L1000 70"/>
        </circle>
        <circle r="3.5" fill="#79c0ff">
          <animateMotion dur="7s" repeatCount="indefinite" path="M820 90L1000 70L1120 160L980 250L820 230Z"/>
        </circle>
        <circle r="3.5" fill="#d29922">
          <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite" path="M820 90L1000 70L1120 160L980 250L820 230Z"/>
        </circle>
      </g>

      <!-- central switch with pulse -->
      <circle cx="930" cy="160" r="16" fill="none" stroke="#a371f7" stroke-width="2">
        <animate attributeName="r" values="16;34" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle class="hub" cx="930" cy="160" r="16"/>
      <path d="M922 156h16M922 164h16" stroke="#a371f7" stroke-width="2" stroke-linecap="round"/>

      <!-- routers / hosts -->
      <circle class="node" cx="820"  cy="90"  r="10"/>
      <circle class="node" cx="1000" cy="70"  r="10"/>
      <circle class="node" cx="1120" cy="160" r="10"/>
      <circle class="node" cx="980"  cy="250" r="10"/>
      <circle class="node" cx="820"  cy="230" r="10"/>

      <text class="mono lbl" x="790"  y="68">10.0.1.1/24</text>
      <text class="mono lbl" x="975"  y="48">10.0.2.1/24</text>
      <text class="mono lbl" x="1075" y="192">10.0.3.1/24</text>
      <text class="mono lbl" x="955"  y="282">10.0.4.1/24</text>
      <text class="mono lbl" x="790"  y="262">10.0.5.1/24</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
  </g>
</svg>
